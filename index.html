<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polywerx</title>
<meta name="theme-color" content="#232529">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#2b2d31;--panel:#34373e;--line:#1b1c1f;--text:#dfe2e7;--muted:#9aa0aa;--sel:#3d6ea8;--selb:#5c8fd0;--accent:#7fd1ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:12px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:grid;grid-template-rows:auto auto 1fr 24px;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top);box-sizing:border-box}
#menubar{display:flex;align-items:center;flex-wrap:wrap;min-height:30px;background:#232529;border-bottom:1px solid var(--line);padding:0 6px;gap:1px}
#menus{flex-wrap:wrap}
.menu>button{white-space:nowrap}
.brand{font-weight:700;margin:0 12px 0 4px;color:#fff;letter-spacing:.3px}
.menu{position:relative}
.menu>button{background:none;border:0;color:var(--text);padding:4px 9px;border-radius:4px;cursor:pointer;font:inherit}
.menu>button:hover,.menu.open>button{background:#3a3d44}
.dropdown,#ctx{display:none;position:absolute;min-width:240px;background:#2f3136;border:1px solid var(--line);border-radius:6px;padding:4px;z-index:60;box-shadow:0 10px 28px rgba(0,0,0,.5)}
.dropdown{top:100%;left:0}
.menu.open .dropdown{display:block}
.mi{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border-radius:4px;cursor:pointer;white-space:nowrap}
.mi .ck{width:12px;color:var(--accent);text-align:center}
.mi .lb{flex:1}
.mi .k{color:var(--muted);font-size:11px}
.mi:hover{background:var(--sel)}
.mi:hover .k{color:#d6e6ff}
.mi.dis{opacity:.4;pointer-events:none}
.sep{height:1px;background:#45484f;margin:4px 6px}
.mh{padding:5px 10px 2px 26px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px}
#shelf{display:flex;flex-direction:column;background:#2f3136;border-bottom:1px solid var(--line);min-width:0}
#shelfTabs{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;padding:3px 8px 0;background:#26282c;border-bottom:1px solid #1b1c1f}
#shelfTabs::-webkit-scrollbar{display:none}
.stab{background:#30333a;border:1px solid #1b1c1f;border-bottom:0;color:var(--muted);font:inherit;font-size:11px;padding:3px 11px 4px;border-radius:5px 5px 0 0;cursor:pointer;white-space:nowrap;flex:none}
.stab:hover{color:var(--text);background:#383b42}
.stab.on{background:#2f3136;color:#fff;border-color:#45484f;box-shadow:inset 0 2px 0 var(--accent)}
.stab.add{padding:3px 9px 4px;font-weight:700}
.stab.edit{background:none;border:0;color:var(--accent)}
#shelfBtns{display:flex;flex-wrap:wrap;align-items:center;row-gap:4px;column-gap:4px;padding:4px 8px}
.grp.pin{background:rgba(127,209,255,.05);border-radius:5px;padding-left:2px}
.shelf-empty{color:var(--muted);font-size:11.5px;padding:0 6px;max-width:520px}
#shelfCtx{display:none;position:fixed;min-width:210px;background:#2f3136;border:1px solid var(--line);border-radius:6px;padding:4px;z-index:120;box-shadow:0 10px 28px rgba(0,0,0,.5)}
#shelfCtx .mh{padding-left:10px}
#seBody .se-tabs{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px}
#seBody .se-tabs .stab{border-radius:5px;border-bottom:1px solid #1b1c1f}
#seBody .se-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
#seBody input[type=text],#seBody input[type=search]{background:#1f2125;border:1px solid #111;color:var(--text);border-radius:4px;padding:5px 7px;font:inherit}
#seBody .se-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#seBody .se-col{min-width:0;display:flex;flex-direction:column}
#seBody .se-h{font-weight:600;margin-bottom:6px}#seBody .se-h span{display:block;font-weight:400;color:var(--muted);font-size:11px}
#seBody #seQ{margin-bottom:6px}
#seBody .se-list{border:1px solid #1b1c1f;border-radius:6px;background:#26282c;height:46vh;overflow:auto;padding:4px}
#seBody .se-it{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:4px}
#seBody .se-it:hover{background:#34373e}
#seBody .se-it.sep-it .se-lb{color:var(--muted);font-style:italic}
#seBody .se-it.has .se-lb{color:var(--muted)}
#seBody .se-ic svg{width:18px;height:18px;display:block}
#seBody .se-lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#seBody .se-it button{background:#3a3d44;border:1px solid #26282c;color:var(--text);border-radius:4px;width:24px;height:22px;cursor:pointer;flex:none}
#seBody .se-it button:disabled{opacity:.5;cursor:default}
#seBody .se-menu{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:6px 4px 2px}
#seBody .se-none{color:var(--muted);padding:8px}
@media (max-width:640px){#seBody .se-cols{grid-template-columns:1fr}#seBody .se-list{height:28vh}}
.grp{display:flex;gap:2px;padding-right:8px;margin-right:4px;border-right:1px solid #45484f;flex:none}
.grp:last-child{border-right:0}
.sb,.btn{background:#3a3d44;border:1px solid #26282c;color:var(--text);height:28px;min-width:28px;padding:0 8px;border-radius:4px;cursor:pointer;font:inherit;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sb:hover,.btn:hover{background:#464a54}
.sb.on{background:var(--sel);border-color:var(--selb);color:#fff}
.sb kbd{font:10px ui-monospace,Menlo,Consolas,monospace;color:var(--muted)}
.sb.on kbd{color:#cfe2ff}
.btn{height:26px}
.btn.primary{background:var(--sel);border-color:var(--selb);color:#fff}
main{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;min-height:0}
main.no-ol{grid-template-columns:0 minmax(0,1fr) 300px}
main.no-attr{grid-template-columns:210px minmax(0,1fr) 0}
main.no-ol.no-attr{grid-template-columns:0 1fr 0}
aside{background:var(--panel);overflow:auto;min-height:0;min-width:0}
#outliner{border-right:1px solid var(--line)}
#attr{border-left:1px solid var(--line)}
.ph{position:sticky;top:0;background:#2c2e33;padding:6px 10px;font-weight:600;border-bottom:1px solid var(--line);z-index:2;display:flex;justify-content:space-between;align-items:center}
.ph span{color:var(--muted);font-weight:400}
#viewport{position:relative;min-width:0;min-height:0;background:linear-gradient(#77808c,#4a5059 55%,#33373e);overflow:hidden}
#c{display:block;width:100%;height:100%;outline:none;touch-action:none}
#hud{position:absolute;left:10px;top:8px;font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#eef1f4;text-shadow:0 1px 2px #000;pointer-events:none;white-space:pre}
#viewname{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font:11px ui-monospace,Menlo,monospace;color:#e8ecf0;text-shadow:0 1px 2px #000;pointer-events:none}
#toolhint{position:absolute;right:118px;top:8px;max-width:46%;text-align:right;font-size:11px;color:#eef1f4;text-shadow:0 1px 2px #000;pointer-events:none}
#marquee{position:absolute;border:1px dashed #fff;background:rgba(255,255,255,.08);display:none;pointer-events:none}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(20,22,25,.92);border:1px solid #111;padding:6px 12px;border-radius:6px;display:none;pointer-events:none;max-width:70%;text-align:center}
#status{display:flex;align-items:center;padding:0 10px;background:#232529;border-top:1px solid var(--line);color:var(--muted);gap:18px;white-space:nowrap;overflow:hidden}
#status b{color:var(--text);font-weight:500}
.ol-item{display:flex;align-items:center;gap:6px;padding:3px 8px;cursor:pointer;border-radius:3px;margin:1px 4px}
.ol-item:hover{background:#40444d}
.ol-item.sel{background:var(--sel);color:#fff}
.ol-item.dragover{outline:1px dashed var(--accent)}
.ol-item.hid .nm{opacity:.45}
.ol-ic{width:14px;height:14px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;border-radius:3px;color:#1b1c1f}
.ic-mesh{background:#8fb8e8}.ic-ref{background:#b9a6e8}.ic-draw{background:#9fd89a}.ic-light{background:#f2d36b}.ic-joint{background:#e88fb0}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ol-vis{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 2px;font-size:13px;line-height:1}
.ol-item.sel .ol-vis{color:#d6e6ff}
#olRoot{min-height:60px;padding-bottom:30px}
.sec{border-bottom:1px solid #26282c}
.sec h4{margin:0;padding:6px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#c9cdd4;background:#2f3238}
.row{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:6px;padding:3px 10px}
.row>label{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.duo{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}
.rng{display:grid;grid-template-columns:1fr 54px;gap:4px;align-items:center}
input[type=number],input[type=text],select{width:100%;background:#24262a;border:1px solid var(--line);color:var(--text);border-radius:3px;padding:3px 5px;font:inherit;min-width:0;user-select:text}
input[type=number]:focus,input[type=text]:focus{outline:1px solid var(--selb)}
input[type=color]{width:100%;height:24px;border:1px solid var(--line);background:#24262a;padding:1px 2px;border-radius:3px;cursor:pointer}
input[type=range]{width:100%;accent-color:#6fa4e0}
input[type=checkbox]{accent-color:#6fa4e0}
.btns{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px}
.note{padding:4px 10px 8px;color:var(--muted);font-size:11px;line-height:1.45}
.empty{padding:14px 10px;color:var(--muted);line-height:1.5}
#uvCanvas{display:block;margin:4px 10px 8px;width:calc(100% - 20px);aspect-ratio:1;background:#1e2024;border:1px solid var(--line);border-radius:3px}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100}
#modal{background:#2f3136;border:1px solid var(--line);border-radius:8px;width:min(760px,94vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#modal>header{padding:10px 14px;font-weight:600;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#modal>header button{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
#modalBody{padding:12px 14px;overflow:auto;line-height:1.5;user-select:text}
#modalFoot{padding:10px 14px;display:flex;justify-content:flex-end;gap:6px;border-top:1px solid var(--line)}
textarea{width:100%;height:300px;background:#1e1f22;color:#d6dbe2;border:1px solid #111;border-radius:4px;font:11px ui-monospace,Menlo,monospace;padding:8px;user-select:text;resize:vertical}
kbd{background:#24262a;border:1px solid #111;border-radius:3px;padding:0 4px;font:11px ui-monospace,Menlo,monospace}
.help h3{margin:14px 0 6px;font-size:13px}
.help h3:first-child{margin-top:0}
.help table{border-collapse:collapse;width:100%}
.help td{padding:3px 8px 3px 0;vertical-align:top;border-bottom:1px solid #3a3d44}
.help td:first-child{white-space:nowrap;width:40%}
#tour{position:absolute;right:12px;bottom:12px;width:350px;max-width:calc(100% - 24px);background:rgba(40,42,47,.97);border:1px solid #111;border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.55);display:none;z-index:20;padding:12px 14px;user-select:text}
.tour-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}
#tourX{background:none;border:0;color:var(--muted);font-size:17px;cursor:pointer;line-height:1;padding:0 2px}
.tour-prog{height:3px;background:#1d1f23;border-radius:2px;margin:6px 0 10px;overflow:hidden}
#tourBar{height:100%;background:#ffcf4a;transition:width .3s}
#tour h3{margin:0 0 6px;font-size:14px;color:#fff}
#tourBody{line-height:1.55;color:#d9dde3}
#tourStatus{margin-top:10px;font-size:11.5px;color:var(--muted);min-height:16px}
#tourStatus.ok{color:#6ee09a}
.tour-btns{display:flex;gap:6px;margin-top:10px;align-items:center}
.tour-actions{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.tour-actions .btn{justify-content:center;height:30px}
#tourRing{position:fixed;pointer-events:none;border:2px solid #ffcf4a;border-radius:7px;box-shadow:0 0 0 4px rgba(255,207,74,.22);z-index:95;display:none;animation:tring 1.4s ease-in-out infinite}
.tdot{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #ffcf4a;pointer-events:none;z-index:15;animation:tdot 1.4s ease-in-out infinite;box-shadow:0 0 12px rgba(255,207,74,.7)}
@keyframes tring{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes tdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.25)}}
.sb.ico{flex-direction:column;justify-content:center;height:50px;min-width:50px;padding:3px 5px 2px;gap:1px;font-size:10px;line-height:1.1}
.sb.ico svg{flex:none}
.sb.ico span{white-space:nowrap}
#tip{position:fixed;display:none;z-index:120;max-width:260px;background:#17181b;border:1px solid #000;border-radius:6px;padding:7px 9px;font-size:11.5px;line-height:1.45;color:#d9dde3;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#tip b{color:#fff}
#tip div{margin-top:3px}
#shapeBar{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:none;gap:10px;align-items:center;background:rgba(66,54,28,.96);border:1px solid #a07d2e;border-radius:8px;padding:6px 10px;z-index:6;white-space:nowrap}
#shapeBar input[type=range]{width:110px}
.bs{padding:5px 10px;border-bottom:1px dashed #2a2c30}
.bs.editing{background:#3d3420}
.bs-top{display:grid;grid-template-columns:1fr auto auto auto;gap:3px;margin-bottom:4px}
.btn.sm{height:24px;padding:0 7px}
#bClose{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 2px 0 4px}#bClose:hover{color:#fff}
#banner{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:#2f3136;border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:none;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5}
#lassoSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none;z-index:4}
#lassoSvg polyline{fill:rgba(255,179,64,.12);stroke:#ffb340;stroke-width:1.5;stroke-dasharray:5 3}
#timeline{position:absolute;left:0;right:0;bottom:0;height:78px;display:none;flex-direction:column;background:rgba(36,38,42,.97);border-top:1px solid #111;z-index:7}
#tlControls{display:flex;align-items:center;gap:4px;padding:4px 6px;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;font-size:11.5px}
#tlControls input[type=number]{width:52px}
.tlb{background:#3a3d44;border:1px solid #1b1c1f;color:var(--text);border-radius:4px;height:24px;padding:0 8px;cursor:pointer;font-size:11.5px}
.tlb:hover{background:#464a52}.tlb.on{background:var(--sel)}.tlb:disabled{opacity:.45;cursor:default}
.tll{display:flex;align-items:center;gap:3px;color:var(--muted)}
.tlsep{width:1px;height:18px;background:#4a4d55;margin:0 3px}
#tlCanvas{flex:none;height:42px;width:100%;cursor:ew-resize;display:block}
#tlControls{flex:none;height:32px}
#viewport.tl-on #shapeBar{bottom:96px}#viewport.tl-on #tour{bottom:90px}#viewport.tl-on #banner{bottom:100px}
#refCard{position:absolute;left:10px;bottom:30px;width:210px;background:rgba(30,32,36,.95);border:1px solid #111;border-radius:8px;padding:6px;display:none;z-index:6;box-shadow:0 8px 22px rgba(0,0,0,.45)}
#viewport.tl-on #refCard{bottom:90px}
#refCard img{width:100%;max-height:200px;object-fit:contain;background:#fff;border-radius:4px;display:block}
.rc-head{display:flex;align-items:center;gap:4px;margin-bottom:5px;font-size:11px;color:var(--muted)}
.rc-head .rc-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-head button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:0 3px}
#refCard .btn{width:100%;justify-content:center;margin-top:5px}
#shapePanel{position:absolute;right:116px;top:34px;width:300px;max-height:calc(100% - 60px);display:none;flex-direction:column;background:rgba(44,46,51,.98);border:1px solid #111;border-radius:8px;z-index:8;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#viewport.tl-on #shapePanel{max-height:calc(100% - 130px)}
#shapePanel .sp-head{display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid #1b1c1f;font-weight:600}
#shapePanel .sp-head span{flex:1}
#spX{background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer}
#spBody{overflow:auto;padding-bottom:6px}
.sp-group{padding:8px 10px 3px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px}
.sp-tip{padding:2px 10px 6px;color:var(--muted);font-size:11px;line-height:1.4}
.sp-row{display:flex;gap:6px;padding:5px 8px;border-bottom:1px dashed #2a2c30;align-items:flex-start}
.sp-row.editing{background:#3d3420}
.sp-thumb{width:40px;height:40px;flex:none;border:1px solid #1b1c1f;border-radius:4px;background:#26282c;color:var(--muted);cursor:pointer;padding:0;overflow:hidden;font-size:15px}
.sp-thumb img{width:100%;height:100%;object-fit:cover;background:#fff}
.sp-main{flex:1;min-width:0}
.sp-top{display:flex;gap:3px;align-items:center;margin-bottom:3px}
.sp-name{flex:1;min-width:0}
.sp-key{background:none;border:0;color:#9aa0aa;cursor:pointer;font-size:14px;padding:0 3px}.sp-key.on{color:#f2d36b}
.sp-note{font-size:11px;color:#e8cf8a}
#spMenu{display:none;position:fixed;min-width:250px;background:#2f3136;border:1px solid var(--line);border-radius:6px;padding:4px;z-index:70;box-shadow:0 10px 28px rgba(0,0,0,.5)}
.sc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 10px}
.sc-tile{display:flex;flex-direction:column;align-items:center;gap:2px;background:#3a3d44;border:1px solid #1b1c1f;color:var(--text);border-radius:5px;padding:5px 2px;cursor:pointer;font-size:10px}
.sc-tile.on{background:var(--sel);border-color:var(--selb)}
.ly{padding:4px 10px;border-bottom:1px dashed #2a2c30}.ly.on{background:#2c3a4d}
.ly-top{display:flex;gap:4px;align-items:center;margin-bottom:3px}.ly-top input[type=text]{flex:1;min-width:0}
.ly-eye{background:none;border:0;color:var(--accent);cursor:pointer;font-size:14px;padding:0 2px}
#viewCube{position:absolute;right:10px;top:6px;width:96px;z-index:5;user-select:none}
#vcStage{width:96px;height:84px;display:flex;align-items:center;justify-content:center}
#vcCube{width:56px;height:56px;position:relative;transform-style:preserve-3d}
.vc-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 10px system-ui,sans-serif;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5);border:1px solid rgba(0,0,0,.45);border-radius:4px;backface-visibility:hidden;cursor:pointer;opacity:.92}
.vc-face:hover{filter:brightness(1.3);opacity:1}
.vc-face.on{outline:2px solid #fff;outline-offset:-3px;opacity:1}
.vc-face[data-zone]{filter:none}
.vc-face[data-zone="t"]{box-shadow:inset 0 9px 0 -2px #ffd84a}.vc-face[data-zone="b"]{box-shadow:inset 0 -9px 0 -2px #ffd84a}
.vc-face[data-zone="l"]{box-shadow:inset 9px 0 0 -2px #ffd84a}.vc-face[data-zone="r"]{box-shadow:inset -9px 0 0 -2px #ffd84a}
.vc-face[data-zone="tl"]{box-shadow:inset 9px 9px 0 -2px #ffd84a}.vc-face[data-zone="tr"]{box-shadow:inset -9px 9px 0 -2px #ffd84a}
.vc-face[data-zone="bl"]{box-shadow:inset 9px -9px 0 -2px #ffd84a}.vc-face[data-zone="br"]{box-shadow:inset -9px -9px 0 -2px #ffd84a}

<script type="module">
import * as THREE from 'three';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

/* ============================================================
   Utilities
   ============================================================ */
const $ = s => document.querySelector(s);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const r3 = n => Math.round(n * 1000) / 1000;
const DEG = Math.PI / 180;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ekey = (a, b) => a < b ? a + '_' + b : b + '_' + a;
const avg2 = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];

/* ============================================================
   Polygon mesh data: verts [[x,y,z]], faces [{v:[i..], uv:[[u,v]..]}]
   ============================================================ */
class PolyMesh {
  constructor(verts = [], faces = []) { this.verts = verts; this.faces = faces; }
  clone() { return new PolyMesh(this.verts.map(p => p.slice()), this.faces.map(f => ({ v: f.v.slice(), uv: f.uv.map(u => u.slice()) }))); }
}

function buildTopo(pm) {
  const map = new Map(), list = [], ef = [];
  const vertEdges = pm.verts.map(() => []), vertFaces = pm.verts.map(() => []);
  pm.faces.forEach((f, fi) => {
    const n = f.v.length;
    for (let i = 0; i < n; i++) {
      const a = f.v[i], b = f.v[(i + 1) % n];
      vertFaces[a].push(fi);
      const k = ekey(a, b);
      let e = map.get(k);
      if (e === undefined) { e = list.length; map.set(k, e); list.push(a < b ? [a, b] : [b, a]); ef.push([]); vertEdges[a].push(e); vertEdges[b].push(e); }
      ef[e].push(fi);
    }
  });
  return { map, list, faces: ef, vertEdges, vertFaces };
}

function faceNormal(pm, f, out = V()) {
  out.set(0, 0, 0);
  const n = f.v.length;
  for (let i = 0; i < n; i++) {
    const a = pm.verts[f.v[i]], b = pm.verts[f.v[(i + 1) % n]];
    out.x += (a[1] - b[1]) * (a[2] + b[2]);
    out.y += (a[2] - b[2]) * (a[0] + b[0]);
    out.z += (a[0] - b[0]) * (a[1] + b[1]);

}
function faceCenter(pm, f, out = V()) {
  out.set(0, 0, 0);
  for (const i of f.v) { const p = pm.verts[i]; out.x += p[0]; out.y += p[1]; out.z += p[2]; }
  return out.multiplyScalar(1 / f.v.length);
}

function cleanFaces(pm) {
  const faces = [];
  for (const f of pm.faces) {
    const v = [], uv = [];
    f.v.forEach((i, c) => { if (v.length && v[v.length - 1] === i) return; v.push(i); uv.push(f.uv[c] || [0, 0]); });
    while (v.length > 1 && v[0] === v[v.length - 1]) { v.pop(); uv.pop(); }
    if (v.length >= 3) faces.push({ v, uv });
  }
  pm.faces = faces;
}
function compact(pm) {
  const used = new Uint8Array(pm.verts.length);
  for (const f of pm.faces) for (const i of f.v) used[i] = 1;
  const remap = new Int32Array(pm.verts.length).fill(-1);
  const verts = [];
  for (let i = 0; i < pm.verts.length; i++) if (used[i]) { remap[i] = verts.length; verts.push(pm.verts[i]); }

}

  const m = new Map(), verts = [], remap = [];

    let j = m.get(k);
    if (j === undefined) { j = verts.length; m.set(k, j); verts.push(p.slice()); }
    remap[i] = j;

  const out = new PolyMesh(verts, pm.faces.map(f => ({ v: f.v.map(i => remap[i]), uv: f.uv })));
  cleanFaces(out);
  return out;
}

/* ---------- Primitives ---------- */

function menuItemsHTML(list) {
  return list.map(id => {
    if (id === '-') return '<div class="sep"></div>';
    if (id[0] === '#') return `<div class="mh">${esc(id.slice(1))}</div>`;
    const a = ACTIONS[id], on = a.check && a.check();
    return `<div class="mi" data-action="${id}"><span class="ck">${on ? '✓' : ''}</span><span class="lb">${esc(a.label)}</span>${a.key ? `<span class="k">${esc(a.key)}</span>` : ''}</div>`;
  }).join('');
}
function renderMenus() {
  $('#menus').innerHTML = MENUS.map(([name], i) => `<div class="menu" data-menu="${i}"><button>${name}</button><div class="dropdown"></div></div>`).join('');

function closeMenus() { document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open')); $('#ctx').style.display = 'none'; }
$('#menus').addEventListener('click', e => {
  const m = e.target.closest('.menu');
  const item = e.target.closest('[data-action]');
  if (item) { closeMenus(); runAction(item.dataset.action); return; }
  if (m && e.target.closest('button')) {
    const open = m.classList.contains('open');
    closeMenus();
    if (!open) { m.querySelector('.dropdown').innerHTML = menuItemsHTML(MENUS[m.dataset.menu][1]); m.classList.add('open'); }
  }
});
$('#menus').addEventListener('mouseover', e => {
  const m = e.target.closest('.menu');
  if (m && document.querySelector('.menu.open') && !m.classList.contains('open')) { closeMenus(); m.querySelector('.dropdown').innerHTML = menuItemsHTML(MENUS[m.dataset.menu][1]); m.classList.add('open'); }
});
document.addEventListener('pointerdown', e => { if (e.target !== canvas && !e.target.closest('.menu') && !e.target.closest('#ctx')) closeMenus(); });
function runAction(id) { const a = ACTIONS[id]; if (!a) return; try { a.fn(); } catch (err) { console.error(err); toast('Something went wrong: ' + err.message); } renderShelf(); }

function openContextMenu(e) {
  const hit = pickObject(e);
  if (hit && sel.mode === 'object' && !sel.objects.includes(hit.id)) { sel.objects = [hit.id]; onSelChanged(); }
  if (hit && sel.mode !== 'object' && hit.kind === 'mesh' && hit.id !== sel.target && !hit.skin) { sel.target = hit.id; sel.objects = [hit.id]; sel.comp.clear(); onSelChanged(); }
  const a = active();
  let items = [];
  if (a && a.kind === 'mesh') items.push('#' + a.name, 'mode.object', 'mode.vertex', 'mode.edge', 'mode.face', '-');
  if (sel.mode === 'face') items.push('mesh.extrude', 'mesh.deleteComp', 'mesh.flip', 'uv.box', 'edit.grow');
  else if (sel.mode === 'edge') items.push('mesh.edgeLoop', 'mesh.insertLoop', 'mesh.deleteComp', 'edit.grow');
  else if (sel.mode === 'vertex') items.push('mesh.merge', 'mesh.deleteComp', 'edit.grow');
  else if (a) {
    if (a.kind === 'mesh') items.push(a.skin ? 'rig.unbind' : 'mesh.smooth', 'edit.duplicate', 'edit.delete', 'mod.center', 'mod.freeze', 'tex.checker', 'tex.upload');
    else if (a.kind === 'joint') items.push('#' + a.name, 'rig.addBone', 'rig.paintBone', '-', 'rig.bind', 'rig.bindPose', 'edit.delete');
    else items.push('edit.duplicate', 'edit.delete');
  } else items.push('#Create', 'create.cube', 'create.sphere', 'create.cylinder', 'create.plane', '-', 'light.directional', 'light.point');
  if (items[items.length - 1] === '-') items.pop();
  const ctx = $('#ctx');
  ctx.innerHTML = menuItemsHTML(items);
  ctx.style.display = 'block';
  const { x, y } = localXY(e);
  ctx.style.left = Math.min(x, vp.clientWidth - ctx.offsetWidth - 4) + 'px';
  ctx.style.top = Math.min(y, vp.clientHeight - ctx.offsetHeight - 4) + 'px';
}
$('#ctx').addEventListener('click', e => { const it = e.target.closest('[data-action]'); if (it) { closeMenus(); runAction(it.dataset.action); } });
